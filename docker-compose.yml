version: '3.8'

services:
  # PostgreSQL - Base de données principale
  postgres:
    image: postgres:15-alpine
    container_name: ofm-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ofm_user
      POSTGRES_PASSWORD: ofm_password_dev_only
      POSTGRES_DB: ofm_db
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ofm-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ofm_user -d ofm_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache, sessions, rate limiting
  redis:
    image: redis:7-alpine
    container_name: ofm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass redis_password_dev_only
    volumes:
      - redis_data:/data
    networks:
      - ofm-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - Message broker pour événements asynchrones
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ofm-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ofm_user
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_dev_only
      RABBITMQ_DEFAULT_VHOST: ofm
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ofm-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO - S3-compatible storage (alternative locale à AWS S3)
  minio:
    image: minio/minio:latest
    container_name: ofm-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ofm-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailhog - Serveur SMTP de développement (capture emails)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ofm-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - ofm-network

  # Adminer - Interface web pour PostgreSQL
  adminer:
    image: adminer:latest
    container_name: ofm-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - ofm-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  ofm-network:
    driver: bridge
