# LiveKit Ingress - développement local sous Windows (service
# livekit-ingress-native de docker-compose.dev.yml, profil livekit-native) :
# reçoit OBS et publie dans le LiveKit natif de l'hôte (host.docker.internal).
#
# OBS (sur la machine hôte) envoie à :
#   rtmp://localhost:1935/live    RTMP (transcodé en plusieurs qualités)
#
# Clés de DÉVELOPPEMENT uniquement (les mêmes que livekit.native.yaml).

api_key: devkey
api_secret: fanvip_dev_livekit_secret_change_me_0123456789abcdef
ws_url: ws://host.docker.internal:7880

# Même Redis que LiveKit (service `redis` du docker-compose) : c'est par lui
# que LiveKit et Ingress dialoguent
redis:
  address: redis:6379
  password: redis_password_dev_only

rtmp_port: 1935
http_relay_port: 9090
health_port: 9091

# Coût CPU (en cœurs) réservé par flux : une entrée est refusée quand il ne
# reste pas assez de CPU libre. Valeurs modestes pour un PC de développement :
# le RTMP est transcodé (décodage + 3 qualités H.264, ~1-2 cœurs en 720p).
cpu_cost:
  rtmp_cpu_cost: 1.0
  url_cpu_cost: 1.0
  min_idle_ratio: 0.1

logging:
  level: info
