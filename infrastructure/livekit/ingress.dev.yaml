# LiveKit Ingress - développement local (service `livekit-ingress` de
# docker-compose.dev.yml) : reçoit le flux d'OBS ("Diffuser avec OBS") et le
# publie dans la salle LiveKit du live, comme le ferait la caméra du créateur.
#
# OBS (sur la machine hôte) envoie à :
#   rtmp://localhost:1935/live    RTMP (transcodé en plusieurs qualités)
# La clé de stream se trouve dans FanVIP :
# Live > Diffuser avec OBS.
#
# Le conteneur partage le réseau du conteneur `livekit` (network_mode:
# service:livekit) : LiveKit annonce 127.0.0.1 dans ses candidats ICE (voir
# livekit.dev.yaml), adresse qui n'atteint LiveKit que depuis son propre
# réseau. Les ports ci-dessus sont donc publiés par le service `livekit`.
#
# Clés de DÉVELOPPEMENT uniquement (les mêmes que livekit.dev.yaml).

api_key: devkey
api_secret: fanvip_dev_livekit_secret_change_me_0123456789abcdef
ws_url: ws://127.0.0.1:7880

# Même Redis que LiveKit (service `redis` du docker-compose) : c'est par lui
# que LiveKit et Ingress dialoguent
redis:
  address: redis:6379
  password: redis_password_dev_only

rtmp_port: 1935
http_relay_port: 9090
health_port: 9091

# Coût CPU (en cœurs) réservé par flux : une entrée est refusée quand il ne
# reste pas assez de CPU libre. Valeurs modestes pour un PC de développement :
# le RTMP est transcodé (décodage + 3 qualités H.264, ~1-2 cœurs en 720p).
cpu_cost:
  rtmp_cpu_cost: 1.0
  url_cpu_cost: 1.0
  min_idle_ratio: 0.1

logging:
  level: info
