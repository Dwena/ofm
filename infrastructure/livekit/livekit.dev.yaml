# LiveKit SFU - développement local (service `livekit` de docker-compose.dev.yml)
#
# Les navigateurs de la machine hôte se connectent à :
#   ws://localhost:7880      signalisation (LIVEKIT_URL de apps/api/.env)
#   <IP du PC>:7882/udp      média WebRTC (un seul port UDP multiplexé)
#   <IP du PC>:7881/tcp      média WebRTC en TCP (repli si l'UDP est bloqué)
#
# Adresse annoncée dans les candidats ICE : la variable NODE_IP du conteneur
# (prioritaire sur node_ip ci-dessous). `npm run dev:up` y met l'IP du PC sur
# le réseau local (ex. 192.168.1.16, détectée automatiquement, ou
# LIVEKIT_NODE_IP pour la forcer). Ni l'IP interne du conteneur (172.x),
# injoignable depuis l'hôte, ni 127.0.0.1 : sous Windows, Chrome / Edge
# n'envoient pas le média WebRTC vers l'adresse de bouclage (la vidéo restait
# noire, « requestsReceived: 0 » dans les logs). node_ip: 127.0.0.1 ne sert que
# de valeur par défaut pour un `docker compose up` lancé à la main.
# Pour un téléphone du réseau local, ajouter LIVEKIT_URL=ws://<IP du PC>:7880
# dans apps/api/.env (un spectateur n'a pas besoin de HTTPS ; diffuser depuis
# le téléphone, si : la caméra n'est accessible qu'en contexte sécurisé).
#
# Clés de DÉVELOPPEMENT uniquement (jamais en production) : les mêmes valeurs
# sont écrites dans apps/api/.env par `npm run dev:up`.

port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  # Un seul port UDP pour tout le média (pas de plage : Docker Desktop publie
  # très lentement les grandes plages UDP)
  udp_port: 7882
  use_external_ip: false
  node_ip: 127.0.0.1
  # 127.0.0.1 est une adresse de bouclage : à autoriser explicitement
  enable_loopback_candidate: true

keys:
  devkey: fanvip_dev_livekit_secret_change_me_0123456789abcdef

room:
  auto_create: true
  # Une salle vide (live quitté sans être terminé) est fermée après 5 min
  empty_timeout: 300
  departure_timeout: 20

# Redis du docker-compose (service `redis`) : indispensable à LiveKit Ingress
# ("Diffuser avec OBS", conteneur ofm-livekit-ingress) qui dialogue avec
# LiveKit par Redis. Sans lui, créer une clé OBS échoue ("ingress not connected").
redis:
  address: redis:6379
  password: redis_password_dev_only

# URLs annoncées pour les entrées OBS (vues depuis la machine hôte)
ingress:
  rtmp_base_url: rtmp://localhost:1935/live

# Spectateurs connectés à la vidéo et statut OBS, vus par l'API (POST /api/v1/webhooks/livekit)
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3001/api/v1/webhooks/livekit

logging:
  level: info
