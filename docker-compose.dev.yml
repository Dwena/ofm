version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ofm-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ofm_user
      POSTGRES_PASSWORD: ofm_password_dev_only
      POSTGRES_DB: ofm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofm_user -d ofm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ofm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password_dev_only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: ofm-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_only
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailDev (SMTP for development)
  maildev:
    image: maildev/maildev
    container_name: ofm-maildev
    restart: unless-stopped
    ports:
      - "1025:1025"      # SMTP
      - "1080:1080"      # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit SFU: video of the lives (the creator uploads once, LiveKit forwards
  # to every viewer with simulcast). Config: infrastructure/livekit/livekit.dev.yaml
  # (dev keys, node_ip 127.0.0.1 so that the browsers of the host can reach the
  # media ports). Single UDP port: big UDP ranges are slow on Docker Desktop.
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: ofm-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"          # signaling (ws://localhost:7880) + room service API
      - "7881:7881/tcp"      # WebRTC over TCP (fallback when UDP is blocked)
      - "7882:7882/udp"      # WebRTC over UDP (single multiplexed port)
    environment:
      # Advertised address of the media ports (LAN IP to test from a phone)
      NODE_IP: ${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./infrastructure/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      # Webhooks to the API running on the host (built in on Docker Desktop, needed on Linux)
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
