# LiveKit SFU - production example (service `livekit` of docker-compose.prod.yml,
# profile "livekit"). See docs/DEPLOYMENT.md, "Live streaming: LiveKit SFU".
#
# API keys are NOT stored here: LIVEKIT_KEYS="<key>: <secret>" in the
# environment (same values as the api's LIVEKIT_API_KEY / LIVEKIT_API_SECRET).

port: 7880
# nginx terminates TLS for wss://livekit.yourdomain.com and proxies here
bind_addresses:
  - 127.0.0.1

rtc:
  # WebRTC over TCP, fallback when UDP is blocked
  tcp_port: 7881
  # Single multiplexed UDP port (or a range: port_range_start / port_range_end, e.g. 50000-60000)
  udp_port: 7882
  # Discover the public IP with STUN and advertise it in the ICE candidates
  use_external_ip: true

# Built-in TURN for restrictive networks (corporate firewalls allowing only 443):
# TURN over TLS on 443 needs its own domain/IP (443 is not shared with nginx here),
# or use 5349 when 443 is taken. Certificates of turn.yourdomain.com.
turn:
  enabled: true
  domain: turn.yourdomain.com
  tls_port: 5349
  udp_port: 3478
  external_tls: false
  cert_file: /etc/ssl/livekit/turn-fullchain.pem
  key_file: /etc/ssl/livekit/turn-privkey.pem

# Redis: required by the Ingress ("Diffuser avec OBS"). Address and password
# come from REDIS_HOST / REDIS_PASSWORD (docker-compose.prod.yml).
redis:
  address: 127.0.0.1:6379

# Public URLs of the Ingress, shown to the creators in OBS settings (the API
# can override them with LIVEKIT_INGRESS_RTMP_URL / LIVEKIT_INGRESS_WHIP_URL).
# WHIP goes through nginx (TLS) to 127.0.0.1:8080; RTMP is direct on 1935.
ingress:
  rtmp_base_url: rtmp://live.yourdomain.com:1935/live
  whip_base_url: https://whip.yourdomain.com/w

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20

# Viewers connected to the video, for the creator's "Santé du live"
webhook:
  api_key: <same value as LIVEKIT_API_KEY>
  urls:
    - https://api.yourdomain.com/api/v1/webhooks/livekit

logging:
  level: info
