version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ofm-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ofm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ofm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ofm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofm-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ofm-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ofm-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: ofm-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ofm-network

  # API Service
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.prod
    container_name: ofm-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ofm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ofm}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://yourdomain.com}
      # WebRTC relay for live streaming (empty = STUN only)
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      STUN_URLS: ${STUN_URLS:-}
      # LiveKit SFU for the live video (empty = peer-to-peer mesh), see
      # docs/DEPLOYMENT.md "Live streaming: LiveKit SFU"
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      # "Diffuser avec OBS" (LiveKit Ingress): public URLs shown to the creators
      # (default: ingress.rtmp_base_url / whip_base_url of livekit.prod.yaml)
      LIVEKIT_INGRESS_RTMP_URL: ${LIVEKIT_INGRESS_RTMP_URL:-}
      LIVEKIT_INGRESS_WHIP_URL: ${LIVEKIT_INGRESS_WHIP_URL:-}
      # Simulcast layers of the transcoded RTMP inputs: 720p (default) or 1080p
      LIVEKIT_INGRESS_RTMP_PRESET: ${LIVEKIT_INGRESS_RTMP_PRESET:-720p}
      # Codec of the transcoded RTMP layers: h264 (default) or vp8 (more CPU)
      LIVEKIT_INGRESS_RTMP_CODEC: ${LIVEKIT_INGRESS_RTMP_CODEC:-h264}
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ofm-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Web Service
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: ofm-web-prod
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ofm-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: ofm-nginx-prod
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - ofm-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # TURN relay for live streaming (optional, see docs/DEPLOYMENT.md
  # "Live streaming: TURN server"). Set TURN_URLS / TURN_SECRET on the api
  # service to use it; host networking keeps the relay port range reachable.
  # coturn:
  #   image: coturn/coturn:4.6
  #   container_name: ofm-coturn-prod
  #   restart: always
  #   network_mode: host
  #   command:
  #     - -n
  #     - --listening-port=3478
  #     - --tls-listening-port=5349
  #     - --realm=${TURN_REALM:-yourdomain.com}
  #     - --use-auth-secret
  #     - --static-auth-secret=${TURN_SECRET}
  #     - --min-port=49160
  #     - --max-port=49200
  #     - --cert=/etc/ssl/turn/fullchain.pem
  #     - --pkey=/etc/ssl/turn/privkey.pem
  #     - --no-cli
  #   volumes:
  #     - ./nginx/ssl:/etc/ssl/turn:ro

  # LiveKit SFU for the live video (see docs/DEPLOYMENT.md "Live streaming:
  # LiveKit SFU"). Started only with the profile: `docker compose --profile livekit up -d`.
  # Host networking: the media ports (UDP 7882, TCP 7881, TURN/TLS 443 or 5349)
  # must be reachable on the public IP. TLS for wss://livekit.yourdomain.com is
  # terminated by nginx (proxy to 127.0.0.1:7880, WebSocket upgrade).
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: ofm-livekit-prod
    restart: always
    profiles: ["livekit"]
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      # "<key>: <secret>" (secret of 32+ random characters), same values as the api's LIVEKIT_API_KEY / LIVEKIT_API_SECRET
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Redis of this compose file (published on 127.0.0.1:6379): needed by the
      # Ingress below ("Diffuser avec OBS"), which talks to LiveKit through it
      REDIS_HOST: 127.0.0.1:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./infrastructure/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
      - ./nginx/ssl:/etc/ssl/livekit:ro

  # LiveKit Ingress: OBS pushes to it (WHIP behind nginx TLS, or RTMP on 1935)
  # and it publishes in the live's LiveKit room. Profile "livekit", host
  # networking (WHIP media on UDP 7885). See docs/DEPLOYMENT.md
  # "Diffuser avec OBS: LiveKit Ingress".
  livekit-ingress:
    image: livekit/ingress:v1.4.3
    container_name: ofm-livekit-ingress-prod
    restart: always
    profiles: ["livekit"]
    network_mode: host
    depends_on:
      - livekit
      - redis
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
      # Same key pair as LiveKit and the api
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
    volumes:
      - ./infrastructure/livekit/ingress.prod.yaml:/etc/ingress.yaml:ro
    deploy:
      resources:
        limits:
          # RTMP transcoding is CPU-bound (~1-2 cores per 720p input, more in 1080p)
          cpus: '4.0'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  ofm-network:
    driver: bridge
